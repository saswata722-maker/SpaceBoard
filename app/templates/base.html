<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NASA Explorer{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        space: {
                            900: '#0b0e1a',
                            800: '#111827',
                            700: '#1e293b',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-space-900 text-gray-100 min-h-screen flex flex-col">
    <nav class="bg-space-800 border-b border-gray-700">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="{{ url_for('home.index') }}" class="text-xl font-bold text-white tracking-tight">
                🌌 NASA Explorer
            </a>
            <button id="nav-toggle" class="md:hidden text-gray-300 hover:text-white" aria-label="Toggle navigation">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
            <div id="nav-links" class="hidden md:flex space-x-6">
                <a href="{{ url_for('home.index') }}" class="text-gray-300 hover:text-white transition">Home</a>
                <a href="{{ url_for('asteroids.index') }}" class="text-gray-300 hover:text-white transition">Asteroids</a>
                <a href="{{ url_for('planets.index') }}" class="text-gray-300 hover:text-white transition">Planets</a>
                <a href="{{ url_for('stars.index') }}" class="text-gray-300 hover:text-white transition">Stars</a>
            </div>
        </div>
        <div id="nav-mobile" class="hidden md:hidden px-4 pb-4 space-y-2">
            <a href="{{ url_for('home.index') }}" class="block text-gray-300 hover:text-white transition">Home</a>
            <a href="{{ url_for('asteroids.index') }}" class="block text-gray-300 hover:text-white transition">Asteroids</a>
            <a href="{{ url_for('planets.index') }}" class="block text-gray-300 hover:text-white transition">Planets</a>
            <a href="{{ url_for('stars.index') }}" class="block text-gray-300 hover:text-white transition">Stars</a>
        </div>
    </nav>

    <main class="flex-1 max-w-6xl mx-auto px-4 py-8 w-full">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-space-800 border-t border-gray-700 py-4 text-center text-gray-500 text-sm">
        <p>NASA Explorer — Data provided by <a href="https://api.nasa.gov/" class="text-blue-400 hover:underline" target="_blank" rel="noopener">NASA Open APIs</a></p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
